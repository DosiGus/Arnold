# Weekly update pull requests for npm packages and GitHub Actions.
# Minor and patch updates come as one grouped pull request per ecosystem;
# major updates stay separate so each one is reviewed on its own.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Declined on purpose (22.11.2026); remove a line once its reason is gone.
    ignore:
      # The server runs on Node 24 (Dockerfile): the types follow the runtime.
      - dependency-name: "@types/node"
        versions: [">=25"]
      # typescript-eslint does not support TypeScript 7 yet.
      - dependency-name: "typescript"
        versions: [">=7"]
      # The test Postgres mirrors the live major version (Supabase: 17).
      - dependency-name: "embedded-postgres"
        versions: [">=18"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
