<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Arnold Kartenübersicht</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        padding: 24px 16px 64px;
        background: #0b0b0c;
        color: #eee;
        font:
          14px/1.4 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 4px;
      }
      p.lead {
        margin: 0 0 24px;
        color: #999;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
        gap: 28px;
      }
      figure {
        margin: 0;
      }
      figcaption {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 8px;
      }
      figcaption b {
        font-size: 15px;
      }
      figcaption a {
        color: #888;
        font-size: 12px;
      }
      figcaption span {
        color: #888;
        font-size: 12px;
        display: block;
      }
      iframe {
        width: 100%;
        height: 640px;
        border: 1px solid #2a2a2d;
        border-radius: 14px;
        background: #1b1b1d;
      }
    </style>
  </head>
  <body>
    <h1>Arnold – alle Karten</h1>
    <p class="lead">
      Synthetische Testdaten. Jede Karte ist live und klickbar, Änderungen
      gelten für alle Karten (neu laden zeigt den neuen Stand).
    </p>
    <div class="grid" id="grid"></div>
    <script>
      const base = "http://localhost:8787/preview";
      const cards = [
        [
          "Start",
          "?card=home",
          "Startansicht mit vier Kacheln: Training, Fortschritt, Ziele, Rekorde.",
        ],
        [
          "Heute",
          "?card=today",
          "Heutiges Training. „Training starten“ öffnet das Training-Logging.",
        ],
        [
          "Fortschritt",
          "?card=stats",
          "Serie, Jahreszahlen und Muskelgruppen.",
        ],
        ["Ziele", "?card=goals", "Körpergewicht und Übungsziele."],
        ["Rekorde", "?card=records", "Alle Rekorde, neueste zuerst."],
        [
          "Verlauf",
          "?card=history",
          "Trainings-Logs: vergangene Trainings, antippen öffnet ein Training.",
        ],
        [
          "Plan",
          "?card=plan",
          "Aktiver Trainingsplan, von hier aus bearbeiten.",
        ],
        [
          "Einrichtung (Onboarding)",
          "?onboarding=1",
          "Frage-Karten für neue Nutzer.",
        ],
      ];
      const grid = document.getElementById("grid");
      for (const [name, query, note] of cards) {
        const fig = document.createElement("figure");
        fig.innerHTML = `<figcaption><div><b>${name}</b><span>${note}</span></div><a href="${base}${query}" target="_blank">einzeln öffnen</a></figcaption><iframe data-src="${base}${query}&standalone"></iframe>`;
        grid.append(fig);
      }
      // Load the cards one after another; all of them at once can stall one.
      const frames = [...document.querySelectorAll("iframe[data-src]")];
      const next = () => {
        const frame = frames.shift();
        if (!frame) return;
        frame.addEventListener("load", () => setTimeout(next, 600), {
          once: true,
        });
        frame.src = frame.dataset.src;
      };
      next();
    </script>
  </body>
</html>
